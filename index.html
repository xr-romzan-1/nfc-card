<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769e8">
<meta name="description" content="XR ROMZAN Digital Card">
<title>XR ROMZAN | Digital Card</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef3ff;color:#101828}
main{max-width:440px;margin:auto;min-height:100vh;background:#eef3ff;overflow:hidden}
.hero{height:260px;position:relative;background:linear-gradient(145deg,#1769e8,#6d8ff5);overflow:visible}
.hero:before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:#fff2}
.hero:after{content:"";position:absolute;width:180px;height:180px;left:-80px;bottom:-90px;border-radius:50%;background:#fff2}
.share{position:absolute;z-index:2;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#1769e8;font-size:22px;box-shadow:0 4px 14px #0002}
.avatar{position:absolute;z-index:2;left:50%;bottom:-68px;transform:translateX(-50%);width:136px;height:136px;border-radius:50%;object-fit:cover;border:7px solid white;box-shadow:0 6px 20px #0003}
.content{text-align:center;padding:90px 22px 35px}
h1{font-size:29px;margin:0 0 8px}.bio{color:#667085;font-size:14px;margin:0 auto 22px;line-height:1.5}
.save{display:block;background:#1769e8;color:#fff;text-decoration:none;padding:15px;border-radius:30px;font-weight:800;font-size:16px;box-shadow:0 8px 20px #1769e84d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.item{text-decoration:none;color:#101828;font-size:11px;font-weight:700}
.ico{height:70px;border-radius:21px;background:white;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 5px 14px #0001}.item span{display:block;margin-top:7px}
.footer{margin-top:25px;color:#98a2b3;font-size:11px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:#101828;color:white;padding:11px 16px;border-radius:22px;font-size:13px;transition:.25s}.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
<section class="hero">
<button class="share" onclick="shareCard()">↗</button>
<img class="avatar" src="assets/profile.jpg" alt="XR ROMZAN">
</section>
<section class="content">
<h1>XR ROMZAN</h1>
<p class="bio">Connect anyone anywhere with my Digital Business Card</p>
<a class="save" href="xr-romzan.vcf" download>Save Contact</a>
<div class="grid">
<a class="item" href="https://facebook.com/" target="_blank"><div class="ico">f</div><span>Facebook</span></a>
<a class="item" href="https://instagram.com/" target="_blank"><div class="ico">◎</div><span>Instagram</span></a>
<a class="item" href="mailto:rsromzan00@gmail.com"><div class="ico">✉</div><span>Email</span></a>
<a class="item" href="tel:+8801973119049"><div class="ico">☎</div><span>Phone</span></a>
<a class="item" href="https://wa.me/8801973119049" target="_blank"><div class="ico">◔</div><span>WhatsApp</span></a>
<a class="item" href="https://linkedin.com/" target="_blank"><div class="ico">in</div><span>LinkedIn</span></a>
</div>
<div class="footer">Open this page from your NFC tag or QR code.</div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
async function shareCard(){
 const data={title:"XR ROMZAN | Digital Card",text:"Connect with XR ROMZAN",url:location.href};
 try{
  if(navigator.share) await navigator.share(data);
  else {await navigator.clipboard.writeText(location.href); show("Link copied");}
 }catch(e){}
}
function show(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1600)}
</script>
</body>
</html>
